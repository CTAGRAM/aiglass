name: backend tests

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: App and MCP server load
        run: |
          python -c "import app.main as m; print(sorted({r.path for r in m.app.routes}))"
          python -c "import asyncio, app.mcp_server as s; print([t.name for t in asyncio.run(s.mcp.list_tools())])"
